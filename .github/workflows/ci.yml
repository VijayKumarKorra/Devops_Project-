name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Unit tests
        run: pytest userapi/test/test_unit.py -v --tb=short

      - name: Configuration tests
        run: pytest userapi/test/test_config.py -v --tb=short

      - name: Connection tests
        run: pytest userapi/test/test_connection.py -v --tb=short

      - name: API tests
        run: pytest userapi/test/test_api.py -v --tb=short
