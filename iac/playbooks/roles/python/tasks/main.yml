---
- name: Fix any interrupted dpkg operations
  command: dpkg --configure -a
  ignore_errors: yes

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Python 3 and pip
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - libpq-dev
      - build-essential
    state: present

- name: Install application Python dependencies
  pip:
    requirements: "{{ app_dir }}/requirements.txt"
    executable: pip3
